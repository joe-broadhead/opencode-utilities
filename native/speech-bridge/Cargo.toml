[package]
name = "utilities-speech"
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
publish = false

[dependencies]
aurum-core = { git = "https://github.com/joe-broadhead/aurum", rev = "8e3b70fbb0c76add3cbcf7291098e88f2c8bea70", default-features = false, features = ["tts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
