name: Feature request
description: A method, a module or a change Utilities should make.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        A new capability starts in the manifest and needs a handler, tests and a recorded fixture. Read AGENTS.md
        before you open the pull request.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change
      options:
        - A time or date method
        - A timer change
        - A weather change
        - A speech change
        - A session stopgap
        - Documentation or layout
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What a person cannot do today, and why Utilities is the right owner (or which owner it should point to).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: The method, its class, the operations it asserts, and what its answer looks like.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and confirmation
      description: For a write, say what it changes and how it is confirmed (an ask, or an install method). For a read, say what it reads.
    validations:
      required: false
