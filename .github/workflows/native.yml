name: native

# Builds the time-keep and weather-signal programs and the speech engine for each platform, then the release files and
# the candidate manifest the release commit pins (NATIVE-DESIGN.md, section 4). Runs on master only, so the candidate
# pins master's commit. Each platform builds on its own runner; one job then gzips the programs, writes
# manifest/native.json from the same bytes, checks every platform, attests the gzips
# and uploads them. It publishes nothing: the release job reads this run's artifacts and checks them against the pins.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-26
          - platform: darwin-x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Refuse anything but master
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::native builds run on master only, so the candidate pins master's commit."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no caches in release builds

      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Native build for this platform
        run: bash scripts/native-build.sh ${{ matrix.platform }}
        env:
          NATIVE_BUILD_ROOT: ${{ runner.temp }}/native-build

      # This platform's programs and its speech engine (where one is built). The models are fetched once, by release.
      - name: Stage this platform's files
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/staged/build-${{ matrix.platform }}"
          mkdir -p "$staged/native" "$staged/speech"
          cp "build/native/${{ matrix.platform }}/time-keep" "build/native/${{ matrix.platform }}/weather-signal" "$staged/native/"
          if [ -f "build/speech-assets/utilities-speech-${{ matrix.platform }}" ]; then
            cp "build/speech-assets/utilities-speech-${{ matrix.platform }}" "$staged/speech/"
          fi
          find "$staged" -type f | sort

      - name: Upload this platform's files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.platform }}
          path: ${{ runner.temp }}/staged/build-${{ matrix.platform }}
          retention-days: 30
          if-no-files-found: error

  release-files:
    name: release files
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no caches in release builds

      - name: Download every platform's files from this run
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'build-*' --dir "$RUNNER_TEMP/builds"

      # Places each platform's files where the build puts them, then fetches the four pinned models (checked by size and
      # sha256 against native/model-sources.json).
      - name: Place the builds and fetch the speech models
        run: |
          set -euo pipefail
          mkdir -p build/speech-assets
          for dir in "$RUNNER_TEMP"/builds/build-*; do
            platform="${dir##*/build-}"
            mkdir -p "build/native/$platform"
            cp "$dir"/native/time-keep "$dir"/native/weather-signal "build/native/$platform/"
            chmod 0755 "build/native/$platform/time-keep" "build/native/$platform/weather-signal"
            for engine in "$dir"/speech/*; do
              [ -e "$engine" ] && cp "$engine" build/speech-assets/ && chmod 0755 "build/speech-assets/$(basename "$engine")"
            done
          done
          node scripts/native-models.mjs

      # Writes manifest/native.json, and the gzips it pins, from the same bytes. The speech manifest is committed.
      - name: Write the manifests and the release files
        run: node scripts/native-files.mjs --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --release-files "$RUNNER_TEMP/release"

      # Every platform must be here: the four programs, and the speech engine wherever ONNX Runtime has a static library.
      - name: Check every platform is present
        run: node scripts/native-files.mjs --check --release

      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*.gz

      - name: Stage the artifacts the release job reads
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/staged"
          mkdir -p "$staged/native-manifest" "$staged/speech-assets"
          cp manifest/native.json "$staged/native-manifest/native.json"
          cp build/speech-assets/* "$staged/speech-assets/"
          # The platform is the suffix before .gz: a program name has dashes too (time-keep), so match the known names.
          for gz in "$RUNNER_TEMP"/release/*.gz; do
            name="$(basename "$gz")"
            for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
              case "$name" in
                *-"$platform".gz)
                  mkdir -p "$staged/native-$platform"
                  cp "$gz" "$staged/native-$platform/"
                  break
                  ;;
              esac
            done
          done
          find "$staged" -type f | sort

      - name: Upload the candidate manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-manifest
          path: ${{ runner.temp }}/staged/native-manifest
          retention-days: 30
          if-no-files-found: error

      - name: Upload the speech engines and models
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speech-assets
          path: ${{ runner.temp }}/staged/speech-assets
          retention-days: 30
          if-no-files-found: error

      - name: Upload the darwin-arm64 files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-darwin-arm64
          path: ${{ runner.temp }}/staged/native-darwin-arm64
          retention-days: 30
          if-no-files-found: error

      - name: Upload the darwin-x64 files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-darwin-x64
          path: ${{ runner.temp }}/staged/native-darwin-x64
          retention-days: 30
          if-no-files-found: error

      - name: Upload the linux-arm64-gnu files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-arm64-gnu
          path: ${{ runner.temp }}/staged/native-linux-arm64-gnu
          retention-days: 30
          if-no-files-found: error

      - name: Upload the linux-x64-gnu files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-x64-gnu
          path: ${{ runner.temp }}/staged/native-linux-x64-gnu
          retention-days: 30
          if-no-files-found: error
