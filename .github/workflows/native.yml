name: native

# Builds the time-keep and weather-signal programs and the speech engine for each platform, then the release files and
# the candidate manifest the release commit pins (NATIVE-DESIGN.md, section 4). Each platform builds on its own runner.
# On Linux the programs build on Ubuntu 22.04, so they run on glibc 2.34 or later, and the speech engine on Ubuntu
# 24.04, because the ONNX Runtime library it links needs glibc 2.38 and GCC 13's libstdc++ (GLIBC_FLOORS in
# src/domain/contract.ts). One job then merges every build, checks each Linux binary against its floor, gzips the
# programs, writes manifest/native.json from the same bytes, checks every platform, attests the gzips and uploads them.
# It publishes nothing: the release job reads this run's artifacts and checks them against the pins.
#
# Every push to master (and every manual run) builds and checks this way, so the tagged commit always has the run the
# release needs. The release workflow attaches only the native programs and `native.json` from that run; the release
# owner's bot carries the pinned speech engine/model bytes across a re-cut, verified against
# manifest/speech-assets.json. A manual run on another branch builds and checks everything the same way, to prove a
# change to the builds before it lands, and attests and stages nothing.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        # `part` is what the runner builds: the programs, the speech engine, or both. `artifact` names its upload; the
        # merge reads build-* and speech-*.
        include:
          - platform: linux-x64-gnu
            part: programs
            runner: boxd-public
            container: ubuntu@sha256:b000e69a50ff940390233025e7a337fb8469b509e2334fa4d018ac30f3e18cdb # 22.04, for the glibc floor
            flags: --no-speech --floors
            artifact: build-linux-x64-gnu
          - platform: linux-x64-gnu
            part: speech
            runner: boxd-public
            flags: --speech-only --floors
            artifact: speech-linux-x64-gnu
          # The arm64 entries stay on GitHub's runners: our scale sets are X64 only. Pending the owner's decision
          # (ci-runners#24): an arm64 scale set, a cross-build, or a recorded exception to decision 0025.
          - platform: linux-arm64-gnu
            part: programs
            runner: ubuntu-22.04-arm
            flags: --no-speech --floors
            artifact: build-linux-arm64-gnu
          - platform: linux-arm64-gnu
            part: speech
            runner: ubuntu-24.04-arm
            flags: --speech-only --floors
            artifact: speech-linux-arm64-gnu
          - platform: darwin-arm64
            part: all
            runner: macos-26
            flags: ""
            artifact: build-darwin-arm64
          - platform: darwin-x64
            part: all
            runner: macos-26-intel
            flags: ""
            artifact: build-darwin-x64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    steps:
      # The 22.04 container is bare: it has the build tools and rustup the hosted 22.04 image carries.
      - name: Container prerequisites
        if: matrix.container
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config xz-utils
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no caches in release builds

      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Native build for this platform
        run: bash scripts/native-build.sh ${{ matrix.platform }} ${{ matrix.flags }}
        env:
          NATIVE_BUILD_ROOT: ${{ runner.temp }}/native-build

      # This runner's part: the programs, the speech engine (where one is built), or both. The models are fetched once,
      # by the merge.
      - name: Stage this runner's files
        env:
          PLATFORM: ${{ matrix.platform }}
          PART: ${{ matrix.part }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/staged/$ARTIFACT"
          mkdir -p "$staged/native" "$staged/speech"
          if [ "$PART" != speech ]; then
            cp "build/native/$PLATFORM/time-keep" "build/native/$PLATFORM/weather-signal" "$staged/native/"
          fi
          if [ "$PART" = speech ] || [ -f "build/speech-assets/utilities-speech-$PLATFORM" ]; then
            cp "build/speech-assets/utilities-speech-$PLATFORM" "$staged/speech/"
          fi
          find "$staged" -type f | sort

      - name: Upload this runner's files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/staged/${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error

  release-files:
    name: release files
    needs: build
    runs-on: boxd-public
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no caches in release builds

      - name: Download every runner's files from this run
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'build-*' --pattern 'speech-*' --dir "$RUNNER_TEMP/builds"

      # Merges the builds: each platform's programs from its build-* upload, and each speech engine from wherever it was
      # built (speech-* on Linux, build-* on macOS). Then fetches the four pinned models (checked by size and sha256
      # against native/model-sources.json).
      - name: Place the builds and fetch the speech models
        run: |
          set -euo pipefail
          mkdir -p build/speech-assets
          for dir in "$RUNNER_TEMP"/builds/build-*; do
            platform="${dir##*/build-}"
            mkdir -p "build/native/$platform"
            cp "$dir"/native/time-keep "$dir"/native/weather-signal "build/native/$platform/"
            chmod 0755 "build/native/$platform/time-keep" "build/native/$platform/weather-signal"
          done
          for engine in "$RUNNER_TEMP"/builds/*/speech/*; do
            [ -e "$engine" ] || continue
            name="$(basename "$engine")"
            [ ! -e "build/speech-assets/$name" ] || { echo "::error::two runners built $name"; exit 1; }
            cp "$engine" build/speech-assets/ && chmod 0755 "build/speech-assets/$name"
          done
          node scripts/native-models.mjs

      # The merged Linux binaries, each against its glibc floor: the programs 2.34, the speech engine 2.39. readelf
      # reads both architectures on this runner.
      - name: Check each Linux binary's glibc floor
        run: |
          set -euo pipefail
          for platform in linux-x64-gnu linux-arm64-gnu; do
            node scripts/native-closure.mjs --floors-only "$platform" "build/native/$platform/time-keep" "build/native/$platform/weather-signal" "build/speech-assets/utilities-speech-$platform"
          done

      # Writes manifest/native.json, and the gzips it pins, from the same bytes. The speech manifest is committed.
      - name: Write the manifests and the release files
        run: node scripts/native-files.mjs --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --release-files "$RUNNER_TEMP/release"

      # Every platform must be here: the four programs, and the speech engine wherever ONNX Runtime has a static library.
      - name: Check every platform is present
        run: node scripts/native-files.mjs --check --release

      # Release files come from master only. A run on another branch stops here: it checked everything, and attests and
      # stages nothing a release could read.
      - name: Attest the release files
        if: github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*.gz

      - name: Stage the artifacts the release job reads
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/staged"
          mkdir -p "$staged/native-manifest" "$staged/speech-assets"
          cp manifest/native.json "$staged/native-manifest/native.json"
          cp build/speech-assets/* "$staged/speech-assets/"
          # The platform is the suffix before .gz: a program name has dashes too (time-keep), so match the known names.
          for gz in "$RUNNER_TEMP"/release/*.gz; do
            name="$(basename "$gz")"
            for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
              case "$name" in
                *-"$platform".gz)
                  mkdir -p "$staged/native-$platform"
                  cp "$gz" "$staged/native-$platform/"
                  break
                  ;;
              esac
            done
          done
          find "$staged" -type f | sort

      - name: Upload the candidate manifest
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-manifest
          path: ${{ runner.temp }}/staged/native-manifest
          retention-days: 30
          if-no-files-found: error

      - name: Upload the speech engines and models
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speech-assets
          path: ${{ runner.temp }}/staged/speech-assets
          retention-days: 30
          if-no-files-found: error

      - name: Upload the darwin-arm64 files
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-darwin-arm64
          path: ${{ runner.temp }}/staged/native-darwin-arm64
          retention-days: 30
          if-no-files-found: error

      - name: Upload the darwin-x64 files
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-darwin-x64
          path: ${{ runner.temp }}/staged/native-darwin-x64
          retention-days: 30
          if-no-files-found: error

      - name: Upload the linux-arm64-gnu files
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-arm64-gnu
          path: ${{ runner.temp }}/staged/native-linux-arm64-gnu
          retention-days: 30
          if-no-files-found: error

      - name: Upload the linux-x64-gnu files
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-x64-gnu
          path: ${{ runner.temp }}/staged/native-linux-x64-gnu
          retention-days: 30
          if-no-files-found: error
