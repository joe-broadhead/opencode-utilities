# The one check, on Node 24: `npm ci --ignore-scripts`, then `npm run check`. The check builds the native files it needs
# (scripts/native-ensure.mjs) and runs the typecheck, the unit tests, the build, the pack test and `plugin-kit check`
# (T0, T1 on OpenCode 2.4.1, the generated docs, the forbidden patterns, no bundled kit).
name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install 1.96.0 --profile minimal
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Native prerequisites
        run: |
          missing=()
          command -v cmake >/dev/null || missing+=(cmake)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 || missing+=(libclang-dev)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "The native prerequisites are already installed."
            exit 0
          fi
          echo "Missing native prerequisites: ${missing[*]}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
      - run: npm ci --ignore-scripts
      - run: npm run check
