# The one local check on public GitHub-hosted runners: a native build for the runner's platform, then
# `npm ci --ignore-scripts` and `npm run check`.
# The pack test loads the packed plugin on each tested stock OpenCode release, the list in src/host/versions.ts.
name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workflows are tools too: a YAML file GitHub refuses fails the whole run, so this is its own job.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x64 and arm64, macOS arm64 and x64: the same four runners as every plugin's CI.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Native build
        run: npm run native:build
        env:
          NATIVE_BUILD_ROOT: ${{ runner.temp }}/native-build
      - run: npm ci --ignore-scripts
      - name: Stock OpenCode (the tested releases)
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x64 ;;
            Linux-ARM64) platform=linux-arm64 ;;
            macOS-X64) platform=darwin-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *) echo "No stock OpenCode build for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          versions=$(node --input-type=module -e "import('./src/host/versions.ts').then(m => console.log(m.TESTED_HOSTS.join(' ')))")
          test -n "$versions"
          for version in $versions; do
            prefix="$RUNNER_TEMP/opencode-$version"
            npm install --prefix "$prefix" --ignore-scripts --no-save --no-audit --no-fund "@opencode/cli-$platform@$version"
            echo "OPENCODE_BIN_${version//./_}=$prefix/node_modules/@opencode/cli-$platform/bin/opencode" >> "$GITHUB_ENV"
          done
      - run: npm run check
