# The one local check, on Node 24: `npm ci --ignore-scripts`, then `npm run check`. The check builds the native files it
# needs (scripts/native-ensure.mjs) and runs the unit, kit, build, host, TUI and pack stages; the pack stage installs
# stock OpenCode 2.4.1 itself, the tested host in src/host/versions.ts.
name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # The event is part of the group, so a run by hand on master never cancels the push run a release stands on.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install 1.96.0 --profile minimal
          else
            # A self-hosted runner may have no rustup: install it and put it on PATH for the native build.
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Native prerequisites
        run: |
          missing=()
          command -v cmake >/dev/null || missing+=(cmake)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 || missing+=(libclang-dev)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "The native prerequisites are already installed."
            exit 0
          fi
          echo "Missing native prerequisites: ${missing[*]}"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends "${missing[@]}"
      # The workflows are tools too: `npm run lint` lints them with actionlint when it is installed, and this puts it on
      # PATH so a workflow GitHub would refuse fails the run.
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          echo "ACTIONLINT_BIN=$PWD/actionlint" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run check
