# Publishes the GitHub Release for a tag the owner cut with `npx plugin-kit release <version>` on master.
#
# `plugin-kit release` checks the repository, writes the local tag, and refuses anything but the 0.0.x line; pushing the
# tag is the owner's step. This workflow then checks the tagged commit again, packs it, records the conformance report,
# and creates the Release with the tarball, SHA256SUMS, the conformance report and dist/.
#
# The `release` environment is the owner's approval: nothing is published before it.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    name: publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write # the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install 1.96.0 --profile minimal
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Native prerequisites
        run: |
          missing=()
          command -v cmake >/dev/null || missing+=(cmake)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 || missing+=(libclang-dev)
          if [ ${#missing[@]} -eq 0 ]; then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
      - run: npm ci --ignore-scripts
      - name: Check the tagged commit again
        run: npm run check
      - name: Pack, and write SHA256SUMS
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/assets"
          (cd "$RUNNER_TEMP/assets" && sha256sum ./*.tgz | sed 's#  \./#  #' > SHA256SUMS)
      - name: Record the conformance report
        run: npx plugin-kit conformance --json > "$RUNNER_TEMP/assets/conformance-report.json"
      - name: Keep dist/
        run: |
          cd dist && zip -q "$RUNNER_TEMP/assets/dist-${{ github.ref_name }}.zip" index.js
      # The programs and speech files the release manifest pins, verified against it and attested by the native run.
      # A tag whose commit carries no manifest/native.json has nothing to attach; `native_install` then reports the
      # programs missing with the install step.
      - name: Attach the pinned native and speech files
        if: hashFiles('manifest/native.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/attach-native.mjs --out "$RUNNER_TEMP/assets/native"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          printf '# %s\n\n%s\n' "${{ github.ref_name }}" "$(git log -1 --format='%s')" > "$notes"
          mapfile -t files < <(find "$RUNNER_TEMP/assets" -type f | sort)
          gh release create "${{ github.ref_name }}" "${files[@]}" \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes-file "$notes"
