# Releases the plugin from a v<version> tag on master, once the protected `release` environment approves it:
#   1. a guard refuses a package marked private, a tag that differs from the version, and install scripts;
#   2. builds the native files on hosted runners for the four platforms, and attests them;
#   3. regenerates the manifests from those bytes, runs npm run check, packs the platform packages and the main package,
#      runs the pack test against those exact tarballs, and attests them;
#   4. publishes the platform packages with npm trusted publishing and provenance;
#   5. publishes the GitHub Release with the speech engines, models and their licences;
#   6. publishes the main package the same way.
# Every publish skips a version that is already on npm, so a rerun is safe.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        name: Refuse private packages and a ref that is not the version's tag
        shell: node {0}
        run: |
          const fs = require("node:fs")
          const read = path => JSON.parse(fs.readFileSync(path, "utf8"))
          const main = read("package.json"), problems = []
          const platforms = fs.readdirSync("npm").map(dir => read(`npm/${dir}/package.json`))
          for (const pkg of [main, ...platforms]) {
            // npm publish --dry-run does not refuse a private package, so this gate does.
            if (pkg.private !== undefined && pkg.private !== false) problems.push(`${pkg.name} is marked private; the release commit removes "private"`)
            if (pkg.version !== main.version) problems.push(`${pkg.name} is ${pkg.version}, not ${main.version}`)
            for (const script of ["preinstall", "install", "postinstall", "prepare", "prepack", "postpack"]) if (pkg.scripts?.[script]) problems.push(`${pkg.name} has a ${script} script`)
          }
          const sorted = record => JSON.stringify(Object.entries(record ?? {}).sort(([a], [b]) => a.localeCompare(b)))
          if (sorted(main.optionalDependencies) !== sorted(Object.fromEntries(platforms.map(p => [p.name, main.version])))) problems.push("optionalDependencies must pin exactly the platform packages at the main version")
          if (process.env.GITHUB_REF_TYPE !== "tag" || process.env.GITHUB_REF_NAME !== `v${main.version}`) problems.push(`run this from the tag v${main.version}`)
          if (problems.length) { for (const p of problems) console.log(`::error::${p}`); process.exit(1) }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${main.version}\n`)

  native:
    needs: gate
    name: native (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        # macos-15 builds against the macOS 14.0 deployment target. Linux builds on ubuntu-24.04, because the prebuilt
        # ONNX Runtime static library links glibc 2.38 and GCC 13 libstdc++ symbols; native-closure.mjs prints the floor.
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust toolchain
        run: rustup toolchain install "$(node -p 'require("./native/sources.json").rust')" --profile minimal
      - name: Build
        run: bash scripts/native-build.sh "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
          NATIVE_BUILD_ROOT: ${{ runner.temp }}/native-build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            npm/opencode-utilities-bin-${{ matrix.platform }}/bin/*
            build/speech-assets/utilities-speech-${{ matrix.platform }}
      # A tar keeps the executable modes, which artifacts drop.
      - name: Collect
        run: |
          # The input stamp lets npm run check in the assemble job see these files as current, with no rebuild.
          files=("npm/opencode-utilities-bin-$PLATFORM"/{bin,NOTICE,provenance.json} "build/native-$PLATFORM.inputs")
          if [[ -f "build/speech-assets/utilities-speech-$PLATFORM" ]]; then
            files+=("build/speech-assets/utilities-speech-$PLATFORM" build/speech-assets/utilities-speech-NOTICE.txt)
          fi
          tar -cf "native-$PLATFORM.tar" "${files[@]}"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: native-${{ matrix.platform }}.tar
          if-no-files-found: error

  assemble:
    needs: [gate, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - name: Manifests from the built bytes
        run: |
          for tar in "$RUNNER_TEMP"/native/native-*.tar; do tar -xf "$tar"; done
          node scripts/native-models.mjs
          node scripts/native-manifest.mjs
          node scripts/native-manifest.mjs --check --release
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Pack
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/npm" "$out/assets"
          # scripts/pack.mjs adds os, cpu and libc to platform packages, and drops workspaces from the main package.
          for dir in npm/*/ .; do bun scripts/pack.mjs "$dir" "$out/npm" > /dev/null; done
          cp build/speech-assets/* manifest/backends.json manifest/speech-assets.json "$out/assets/"
          cp licenses/upstream/{Whisper-MIT.txt,whisper-model-card.md,KittenTTS-Apache-2.0.txt,kitten-model-card.md,misaki-original-LICENSE.txt,misaki-original-README.md.txt} "$out/assets/"
      - name: Run the pack test against those exact tarballs
        run: PACKED_DIR="$RUNNER_TEMP/release/npm" bun test test/pack
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/npm/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  npm-platforms:
    needs: [gate, assemble]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Platform packages first, so the main package never names a version that is missing.
      - name: Publish the platform packages
        run: |
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a * 1e6 + b * 1e3 + c < 11005001) { console.log("::error::npm trusted publishing needs npm 11.5.1 or later"); process.exit(1) }' "$(npm --version)"
          for tarball in release/npm/joe-broadhead-opencode-utilities-bin-*-"$VERSION".tgz; do
            name="$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            # npm view prints the version when it exists, and fails with E404 when it is not published yet.
            if [[ "$(npm view "$name@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
              echo "$name@$VERSION is already on npm; skipping it."
              continue
            fi
            npm publish "$tarball" --provenance --access public
          done
        env:
          VERSION: ${{ needs.gate.outputs.version }}

  github-release:
    needs: [gate, npm-platforms]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # The speech files go public before the main package that downloads them. A rerun finishes a draft from an
      # earlier run, and leaves a published release as it is.
      - name: Publish the speech engines, models and licences
        run: |
          if draft="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != true ]]; then echo "Release v$VERSION is already published; skipping it."; exit 0; fi
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "v$VERSION" \
              --notes "Speech engines and models that @joe-broadhead/opencode-utilities $VERSION downloads on first use. Verify a file with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
          fi
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber release/assets/*
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}

  npm-main:
    needs: [gate, github-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the main package
        run: |
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a * 1e6 + b * 1e3 + c < 11005001) { console.log("::error::npm trusted publishing needs npm 11.5.1 or later"); process.exit(1) }' "$(npm --version)"
          name=@joe-broadhead/opencode-utilities
          if [[ "$(npm view "$name@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
            echo "$name@$VERSION is already on npm; skipping it."
            exit 0
          fi
          npm publish "release/npm/joe-broadhead-opencode-utilities-$VERSION.tgz" --provenance --access public
        env:
          VERSION: ${{ needs.gate.outputs.version }}
