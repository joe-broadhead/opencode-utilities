# Publishes the GitHub Release for a tag the owner cut with `npx plugin-kit release <version>` on master.
#
# `plugin-kit release` checks the repository, writes the local tag, and refuses anything but the 0.0.x line; pushing the
# tag is the owner's step. This workflow then checks the tagged commit again, packs it, records the conformance report,
# and creates the Release with the tarball, the report, SHA256SUMS and, when the tagged commit has a successful native
# run, that run's vetted `native.json` and the pinned native/speech files. Every one is named from `manifest/native.json`
# and `manifest/speech-assets.json`: the release never passes the native directory or a wildcard for those files, so a
# directory cannot be uploaded as an asset. A tag with no native run on its commit attaches the three core assets only.
#
# The tag is the owner's approval: there is no `release` environment, so the release bot can publish once the tag exists.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write # the GitHub Release
      actions: read # the native run's manifest and pinned files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install 1.96.0 --profile minimal
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Native prerequisites
        run: |
          missing=()
          command -v cmake >/dev/null || missing+=(cmake)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          ls /usr/lib/llvm-*/lib/libclang.so* >/dev/null 2>&1 || missing+=(libclang-dev)
          if [ ${#missing[@]} -eq 0 ]; then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
      - name: Fetch the contract over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - name: Check the tagged commit again
        run: npm run check
      - name: The tag names this package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$TAG"
      # The native workflow uploads the manifest it built for every platform, with the run id the files are pinned to.
      # It must be the run on the tagged commit: the release uses that manifest and those artifacts, never a locally
      # generated placeholder (native:ensure writes one with run 0). No successful run means no native or speech extras.
      - name: Fetch the pinned native manifest from the tagged commit's native run
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          run="$(gh run list --workflow native.yml --branch master --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run" ]; then
            echo "No successful native run on $GITHUB_SHA: the release carries the tarball, conformance.json and SHA256SUMS only."
            exit 0
          fi
          gh run download "$run" --name native-manifest --dir "$RUNNER_TEMP/native-manifest"
          node scripts/release-manifest.mjs "$RUNNER_TEMP/native-manifest/native.json" "$TAG" "$GITHUB_SHA"
          cp "$RUNNER_TEMP/native-manifest/native.json" manifest/native.json
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Pack, and write SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "${{ steps.native.outputs.present }}" = "true" ]; then
            cp manifest/native.json release/native.json
          else
            # native:ensure wrote a placeholder with run 0; it is not a release manifest, so the tarball does not carry it.
            rm -f manifest/native.json
          fi
          npx plugin-kit check --json > release/conformance.json
          npm pack --pack-destination release
          sha256sum release/*.tgz release/conformance.json > release/SHA256SUMS
      # The programs and speech files the release manifests pin, verified against them and attested by the native run.
      # A tag whose commit has no native run has nothing to attach; `native_install` then reports the file missing with
      # the install step, and the installer can still fetch a `native.json` published by a later release.
      - name: Attach the pinned native and speech files
        if: steps.native.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/attach-native.mjs --out release/native
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(release/*.tgz release/conformance.json release/SHA256SUMS)
          if [ "${{ steps.native.outputs.present }}" = "true" ]; then
            assets+=(release/native.json)
            # Written to a file first, so a failed name check stops the release instead of uploading a partial list.
            node scripts/release-assets.mjs release/native > "$RUNNER_TEMP/native-files.txt"
            mapfile -t extras < "$RUNNER_TEMP/native-files.txt"
            assets+=("${extras[@]}")
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
